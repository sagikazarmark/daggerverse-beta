jobs:
    check:
        name: ${{ matrix.check }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - name: Check
              uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
              with:
                args: ${{ matrix.check }}
                verb: check
        strategy:
            fail-fast: false
            matrix:
                check:
                    - alpha:build
                    - alpha:fmt
                    - alpha:test:integration
                    - alpha:test:unit
                    - beta:lint
name: Dagger
"on":
    pull_request: {}
    push:
        branches:
            - main
permissions:
    contents: read
